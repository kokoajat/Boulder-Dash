# Julkaisee web/-kansion (peli) GitHub Pagesiin.
# Käyttöönotto: repon Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Julkaise peli GitHub Pagesiin

on:
  push:
    branches:
      - main
      - claude/klassikkopeli-android-cmow95
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Luolien tarkistus ja moottorin testit
        run: |
          node tests/validate-caves.js
          node tests/engine.test.js
          node tests/playthrough.js 30

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Leimaa service worker commitin tunnisteella
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" web/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
