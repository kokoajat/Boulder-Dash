<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Boulder Dash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Päävalikko -->
  <section id="menu" class="screen">
    <div class="menuInner">
      <h1 class="title">BOULDER<br>DASH</h1>
      <p class="sub">Kerää timantit, väistä kiviä ja löydä uloskäynti.</p>
      <button id="btnContinue" class="btn primary big">Pelaa</button>
      <h2>Luolat</h2>
      <div id="levels" class="levels"></div>
      <h2>Asetukset</h2>
      <div class="opts">
        <div class="optRow">
          <span class="optLabel">Ohjaus:</span>
          <button id="optDpad" class="opt">Nuolinäppäimet</button>
          <button id="optJoy" class="opt">Joystick</button>
        </div>
        <div class="optRow">
          <button id="optSound" class="opt">Ääni: päällä</button>
        </div>
      </div>
      <p class="stats">Pisteet yhteensä: <b id="totalScore">0</b> · Kuolemia: <b id="deaths">0</b> · Elämiä: <b>∞</b></p>
      <p class="help">Näppäimistö: nuolet tai WASD, Esc = tauko.</p>
      <button id="btnReset" class="btn small danger">Nollaa edistyminen</button>
      <p class="version"><span id="version"></span></p>
    </div>
  </section>

  <!-- Peliruutu -->
  <section id="gameScreen" class="screen" hidden>
    <header id="hud">
      <span id="hudDiamonds">💎 0/0</span>
      <span id="hudTime">⏱ 0</span>
      <span id="hudScore">★ 0</span>
      <span id="hudCave" class="cave"></span>
      <button id="btnPause" class="hudBtn" aria-label="Tauko">❚❚</button>
    </header>
    <div id="playArea">
      <canvas id="game"></canvas>
      <div id="overlay" hidden>
        <div class="card">
          <h2 id="ovTitle"></h2>
          <p id="ovText"></p>
          <div id="ovButtons" class="ovButtons"></div>
        </div>
      </div>
    </div>
    <div id="controls">
      <div id="dpad">
        <button class="dbtn up" data-dx="0" data-dy="-1" aria-label="Ylös">▲</button>
        <button class="dbtn left" data-dx="-1" data-dy="0" aria-label="Vasen">◀</button>
        <div class="dcenter"></div>
        <button class="dbtn right" data-dx="1" data-dy="0" aria-label="Oikea">▶</button>
        <button class="dbtn down" data-dx="0" data-dy="1" aria-label="Alas">▼</button>
      </div>
      <div id="joystick" hidden>
        <div class="joyHint">Kosketa ja vedä</div>
        <div id="joyBase" hidden>
          <div class="arrow u">▲</div><div class="arrow d">▼</div>
          <div class="arrow l">◀</div><div class="arrow r">▶</div>
          <div id="joyKnob"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/sprites.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/caves.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
