<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Klassinen Boulder Dash -luolapeli selaimeen ja Android-puhelimeen.">
  <title>Boulder Dash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Päävalikko -->
  <section id="menu" class="screen">
    <div class="menuInner">
      <header class="hero">
        <div class="gem">◆</div>
        <h1 class="title">Boulder<br>Dash</h1>
        <p class="sub">Kaiva, kerää timantit, väistä vieriviä kiviä ja löydä uloskäynti ennen kuin aika loppuu.</p>
      </header>
      <button id="btnContinue" class="btn primary big">▶ Pelaa</button>
      <button id="btnInstall" class="btn install" hidden>📲 Asenna sovellus puhelimeen</button>

      <section class="levelsSection">
        <h2>Luolat</h2>
        <div id="levels" class="levels"></div>
      </section>

      <div class="card">
        <h2>Asetukset</h2>
        <div class="optRow">
          <span class="optLabel">Ohjaus</span>
          <div class="seg">
            <button id="optDpad" class="opt">Nuolinäppäimet</button>
            <button id="optJoy" class="opt">Joystick</button>
          </div>
        </div>
        <div class="optRow">
          <span class="optLabel">Herkkyys</span>
          <div class="seg">
            <button id="optSensLow" class="opt">Matala</button>
            <button id="optSensMed" class="opt">Keski</button>
            <button id="optSensHigh" class="opt">Korkea</button>
          </div>
        </div>
        <div class="optRow">
          <span class="optLabel">Rockfordin nopeus</span>
          <div class="seg">
            <button id="optSpeedSlow" class="opt">Hidas</button>
            <button id="optSpeedNormal" class="opt">Normaali</button>
            <button id="optSpeedFast" class="opt">Nopea</button>
          </div>
        </div>
        <div class="optRow">
          <span class="optLabel">Grafiikka</span>
          <div class="seg">
            <button id="optModern" class="opt">Moderni</button>
            <button id="optRetro" class="opt">Retro</button>
          </div>
        </div>
        <div class="optRow">
          <span class="optLabel">Ääni</span>
          <div class="seg"><button id="optSound" class="opt">🔊 Ääni päällä</button></div>
        </div>
      </div>

      <div class="card stats">
        <div><span class="statVal" id="totalScore">0</span><span class="statLbl">pistettä</span></div>
        <div><span class="statVal" id="deaths">0</span><span class="statLbl">kuolemaa</span></div>
        <div><span class="statVal">∞</span><span class="statLbl">elämää</span></div>
      </div>
      <p class="help">Näppäimistö: nuolet tai WASD · Esc = tauko</p>
      <div class="footer">
        <button id="btnReset" class="btn small danger">Nollaa edistyminen</button>
        <span class="version" id="version"></span>
      </div>
    </div>
  </section>

  <!-- Peliruutu -->
  <section id="gameScreen" class="screen" hidden>
    <header id="hud">
      <span id="hudDiamonds" class="chip">💎 0/0</span>
      <span id="hudTime" class="chip">⏱ 0</span>
      <span id="hudScore" class="chip">★ 0</span>
      <span id="hudCave" class="cave"></span>
      <button id="btnPause" class="hudBtn" aria-label="Tauko">❚❚</button>
    </header>
    <div id="playArea">
      <canvas id="game"></canvas>
      <div id="overlay" hidden>
        <div class="card ovCard">
          <h2 id="ovTitle"></h2>
          <p id="ovText"></p>
          <div id="ovButtons" class="ovButtons"></div>
        </div>
      </div>
    </div>
    <div id="controls">
      <div id="dpad">
        <button class="dbtn up" data-dx="0" data-dy="-1" aria-label="Ylös">▲</button>
        <button class="dbtn left" data-dx="-1" data-dy="0" aria-label="Vasen">◀</button>
        <div class="dcenter"></div>
        <button class="dbtn right" data-dx="1" data-dy="0" aria-label="Oikea">▶</button>
        <button class="dbtn down" data-dx="0" data-dy="1" aria-label="Alas">▼</button>
      </div>
      <div id="joystick" hidden>
        <div class="joyHint">Kosketa ja vedä</div>
        <div id="joyBase" hidden>
          <div class="arrow u">▲</div><div class="arrow d">▼</div>
          <div class="arrow l">◀</div><div class="arrow r">▶</div>
          <div id="joyKnob"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/sprites.js"></script>
  <script src="js/sprites-modern.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/caves.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
